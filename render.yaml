# FlowArc on Render — Next.js web + Postgres (Blueprint)
# Source of truth: https://github.com/0xjiongying/tableos
# Public URL: https://tableos-web.onrender.com
#
# After merging to master: Dashboard → Blueprint → Manual Sync, or wait for auto-deploy.

databases:
  - name: tableos-demo-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: tableos-web
    runtime: node
    plan: free
    region: oregon
    branch: master
    autoDeployTrigger: commit
    # Install all workspace deps (incl. Prisma CLI), then production-build the Next app.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @flowarc/web build
    # Apply schema + demo seed before each release so staff/guest flows have data.
    preDeployCommand: pnpm --filter @flowarc/web exec prisma db push && pnpm --filter @flowarc/web db:seed
    # Bind to Render's PORT on all interfaces (required).
    startCommand: pnpm --filter @flowarc/web exec next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tableos-demo-db
          property: connectionString
      - key: DEMO_AUTH_ENABLED
        value: "true"
      - key: DEMO_STAFF_PASSWORD
        value: tableos-demo
      - key: PAYMENTS_ADAPTER
        value: mock
      - key: AI_ENABLED
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://tableos-web.onrender.com

# TableOS on Render — Next.js web + existing Postgres
# Source of truth: https://github.com/0xjiongying/tableos
# Public deploy mirror (Render GitHub access): https://github.com/0xjiongying/tableos-render

databases:
  - name: tableos-demo-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: tableos
    runtime: node
    plan: free
    region: oregon
    branch: master
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tableos/web build
    startCommand: pnpm --filter @tableos/web exec next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tableos-demo-db
          property: connectionString
      - key: DEMO_AUTH_ENABLED
        value: "true"
      - key: DEMO_STAFF_PASSWORD
        value: tableos-demo
      - key: PAYMENTS_ADAPTER
        value: mock
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://tableos.onrender.com

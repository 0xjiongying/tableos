# FlowArc on Render — Next.js web + Postgres (Blueprint)
# Source of truth: https://github.com/0xjiongying/tableos
# Public URL: https://tableos-web.onrender.com
#
# After merging to master: Dashboard → Blueprint → Manual Sync, or wait for auto-deploy.

databases:
  - name: tableos-demo-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: tableos-web
    runtime: node
    plan: free
    region: oregon
    branch: master
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    # Fail-fast schema/seed — must not hang the deploy on DB connect
    preDeployCommand: node scripts/render-predeploy.mjs
    # Explicit host + Render $PORT (shell expands $PORT; do not hardcode)
    startCommand: sh -c 'cd apps/web && exec npx next start -H 0.0.0.0 -p "$PORT"'
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Ensure npm install still includes build-time devDependencies (typescript, tailwind, etc.)
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tableos-demo-db
          property: connectionString
      - key: DEMO_AUTH_ENABLED
        value: "true"
      - key: DEMO_STAFF_PASSWORD
        value: tableos-demo
      - key: PAYMENTS_ADAPTER
        value: mock
      - key: AI_ENABLED
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://tableos-web.onrender.com

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tableos
          POSTGRES_PASSWORD: tableos
          POSTGRES_DB: tableos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tableos -d tableos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tableos:tableos@localhost:5432/tableos?schema=public
      DEMO_AUTH_ENABLED: "true"
      PAYMENTS_ADAPTER: mock
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      AI_ENABLED: "false"
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Push schema + seed
        run: |
          npm run db:push
          npm run db:seed

      - name: Install Playwright browser
        run: npx --workspace=@flowarc/web playwright install chromium --with-deps

      - name: E2E smoke
        run: npm run test:e2e
